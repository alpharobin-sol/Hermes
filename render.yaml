# Render blueprint for the Hermes API (backend/)
# Render → New → Blueprint → pick this repo. Fill in the secrets it asks for.
services:
  - type: web
    name: hermes-api
    runtime: node
    plan: free
    rootDir: backend
    # NODE_OPTIONS is cleared for the build so the runtime heap cap below never applies to tsc
    buildCommand: NODE_OPTIONS= npm install --include=dev && NODE_OPTIONS= npm run build
    # Free plan has 512 MB RAM. The API runs around 150 MB.
    startCommand: node --max-old-space-size=300 dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: https://www.hermesagg.xyz,https://hermesagg.xyz,https://hermes-three-beta.vercel.app
      - key: LOG_LEVEL
        value: info
      # Real funds. Must match the frontend's NEXT_PUBLIC_SOLANA_NETWORK on Vercel.
      # Set both to devnet to test with test SOL.
      - key: SOLANA_NETWORK
        value: mainnet-beta
      # Largest single SOL deposit into a route that is still in beta
      - key: BETA_DEPOSIT_CAP_SOL
        value: "10"
      # Secrets: Render asks for these when you create the blueprint
      - key: JUPITER_API_KEY
        sync: false
      # Optional: a private mainnet RPC (Helius, Triton). Defaults to solana-rpc.publicnode.com
      - key: SOLANA_RPC_URL
        sync: false
      # Portfolio: an RPC that keeps full wallet history (a Helius RPC URL with its key), for what staking tokens and
      # Jupiter Lend have earned. Without it the portfolio leaves those earnings out.
      - key: SOLANA_HISTORY_RPC_URL
        sync: false
      # Hermes's own rate history: Supabase Postgres, Session pooler connection string. Without it history is off.
      - key: DATABASE_URL
        sync: false
      # Optional: fixed keys for phone alerts. Without them Hermes creates a pair once and keeps it in the database.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Herald, the Telegram group's bot (backend/src/herald). Off without a token.
      # The token from @BotFather for @HermesAggHeraldBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # The Hermes group's id. Send /groupid in the group as an admin and Herald replies with it.
      - key: TELEGRAM_GROUP_ID
        sync: false
      # Herald's answers come from Claude. Without a key he still welcomes and moderates, and points questions to Docs.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: HERALD_MODEL (default claude-opus-5-5), HERALD_DAILY_ANSWERS (default 300),
      # HERALD_AUTO_ANSWER=false to answer only when mentioned, replied to or asked with /ask,
      # TELEGRAM_BOT_USERNAME if the bot is ever renamed (alert links open t.me/HermesAggHeraldBot by default)
