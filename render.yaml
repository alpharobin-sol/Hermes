# Render blueprint for the Hermes API (backend/)
# Render → New → Blueprint → pick this repo. Fill in the secrets it asks for.
services:
  - type: web
    name: hermes-api
    runtime: node
    plan: free
    rootDir: backend
    # NODE_OPTIONS is cleared for the build so the runtime heap cap below never applies to tsc
    buildCommand: NODE_OPTIONS= npm install --include=dev && NODE_OPTIONS= npm run build
    # Free plan has 512 MB RAM. The API runs around 150 MB.
    startCommand: node --max-old-space-size=300 dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: https://www.hermesagg.xyz,https://hermesagg.xyz,https://hermes-three-beta.vercel.app
      - key: LOG_LEVEL
        value: info
      # Real funds. Must match the frontend's NEXT_PUBLIC_SOLANA_NETWORK on Vercel.
      # Set both to devnet to test with test SOL.
      - key: SOLANA_NETWORK
        value: mainnet-beta
      # Largest single SOL deposit into a route that is still in beta
      - key: BETA_DEPOSIT_CAP_SOL
        value: "10"
      # Secrets: Render asks for these when you create the blueprint
      - key: JUPITER_API_KEY
        sync: false
      # Optional: a private mainnet RPC (Helius, Triton). Defaults to solana-rpc.publicnode.com
      - key: SOLANA_RPC_URL
        sync: false
